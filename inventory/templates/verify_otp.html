{% extends 'base.html' %}

{% block title %}Verify OTP - Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body p-5">
                <h3 class="card-title text-center mb-4">Email Verification</h3>
                <p class="text-center text-muted">A 6-digit OTP has been sent to <strong>{{ email }}</strong>. Please enter it below to verify your account.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="otp" class="form-label">Enter OTP</label>
                        <input type="text" name="otp" id="otp" class="form-control text-center fs-4" maxlength="6" placeholder="000000" pattern="\d{6}" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Verify</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'inventory:register' %}">Back to Register</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
