<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email Verification Code</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .otp-box { display: inline-block; padding: 16px 32px; background-color: #0d6efd; color: #fff; font-size: 28px; letter-spacing: 4px; font-weight: bold; border-radius: 8px; }
        .footer { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Verify Your Email</h2>
        <p>Hi {{ user.username }},</p>
        <p>Your verification code is:</p>
        <p style="text-align: center; margin: 30px 0;">
            <span class="otp-box">{{ otp }}</span>
        </p>
        <p>Enter this code on the verification page to complete your registration.</p>
        <p>If you did not request this code, you can safely ignore this email.</p>
        <div class="footer">
            <p>&copy; 2026 Inventory Management System</p>
        </div>
    </div>
</body>
</html>
